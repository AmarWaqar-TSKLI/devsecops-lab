name: Container Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t task-api:ci .

      - name: Scan the Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          cache: false

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-api:ci
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          cache: false

      - name: Create the SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-api:ci
          format: cyclonedx
          output: sbom.cdx.json
          cache: false

      - name: Keep the SBOM
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sbom
          path: sbom.cdx.json
